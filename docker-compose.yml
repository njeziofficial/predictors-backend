# Project name matches the existing containers/volume so `docker compose up -d` reuses them.
name: backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: octopus_postgres
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus123
      POSTGRES_DB: octopus_prediction
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus -d octopus_prediction"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octopus_api
    ports:
      - "5000:8080"
    environment:
      # Supabase session-pooler connection string, from the gitignored .env next to this file.
      - ConnectionStrings__DefaultConnection=${SUPABASE_DB_CONNECTION:?Set SUPABASE_DB_CONNECTION in .env}
      - Jwt__Key=octopus-prediction-super-secret-jwt-key-change-in-production-32chars
      - Jwt__Issuer=OctopusPrediction
      - Jwt__Audience=OctopusPrediction
      - Jwt__ExpiryMinutes=10080
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  # Public HTTPS tunnel to the API so the Cloudflare-hosted frontend's Worker can reach it.
  # NGROK_AUTHTOKEN and NGROK_DOMAIN come from the gitignored .env next to this file.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: octopus_ngrok
    command: ["http", "api:8080", "--url=${NGROK_DOMAIN}"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - api
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: octopus_adminer
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=octopus_postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - predictors_default
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: predictors_pgdata

networks:
  default: {}
  predictors_default:
    external: true
