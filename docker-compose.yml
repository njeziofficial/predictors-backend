version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: octopus_postgres
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus123
      POSTGRES_DB: octopus_prediction
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus -d octopus_prediction"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octopus_api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=octopus_prediction;Username=octopus;Password=octopus123
      - Jwt__Key=octopus-prediction-super-secret-jwt-key-change-in-production-32chars
      - Jwt__Issuer=OctopusPrediction
      - Jwt__Audience=OctopusPrediction
      - Jwt__ExpiryMinutes=10080
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: octopus_adminer
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=octopus_postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - predictors_default
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: predictors_pgdata

networks:
  default: {}
  predictors_default:
    external: true
